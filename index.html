<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f5c542" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="方仔生存指南" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="和方仔一起过完一天班：早高峰、早会、临时需求，一路选到下班。看你是摸鱼大师、卷王，还是准点下班侠。" />
  <link rel="icon" type="image/png" href="assets/icon.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <title>方仔打工人生存指南</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="rotate" aria-hidden="true">请把手机竖过来再上岗</div>
    <div id="stage">
      <div id="bg" aria-hidden="true"></div>

      <section id="screen-start" class="screen active">
        <div class="hero">
          <img id="hero-sticker" src="assets/stickers/f18.png" alt="方仔周一上班" />
          <p class="kicker">方仔上班中 · 文字选择</p>
          <h1 class="logo">方仔打工人<br />生存指南</h1>
          <p class="tagline">从早高峰活到下班铃，精力、心情、工资三条数值都要顾。看看你是哪种打工人。</p>
        </div>
        <button type="button" id="btn-start" class="btn primary">开始上班</button>
      </section>

      <section id="screen-event" class="screen" hidden>
        <div class="daybar">
          <div class="daybar-left">
            <span id="event-time">08:16</span>
            <span id="event-period">早晨</span>
          </div>
          <div class="daybar-right">
            <span id="event-progress">1 / 8</span>
          </div>
        </div>
        <div id="progress-pips" class="pips" aria-hidden="true"></div>

        <div id="meters" class="meters" aria-live="polite">
          <div class="meter" data-key="energy">
            <div class="meter-head">
              <span class="meter-name">精力</span>
              <span class="meter-val" id="val-energy">50</span>
            </div>
            <div class="meter-track">
              <div class="meter-bar" id="bar-energy"></div>
            </div>
          </div>
          <div class="meter" data-key="mood">
            <div class="meter-head">
              <span class="meter-name">心情</span>
              <span class="meter-val" id="val-mood">52</span>
            </div>
            <div class="meter-track">
              <div class="meter-bar" id="bar-mood"></div>
            </div>
          </div>
          <div class="meter" data-key="salary">
            <div class="meter-head">
              <span class="meter-name">工资</span>
              <span class="meter-val" id="val-salary">54</span>
            </div>
            <div class="meter-track">
              <div class="meter-bar" id="bar-salary"></div>
            </div>
          </div>
        </div>

        <div class="event-main">
          <img id="event-sticker" alt="" />
          <h2 id="event-title"></h2>
          <p id="event-body"></p>
        </div>
        <div id="event-options" class="options"></div>
      </section>

      <section id="screen-compute" class="screen" hidden>
        <div class="compute-wrap">
          <img id="compute-sticker" src="assets/stickers/f23.png" alt="" />
          <p class="compute-kicker" id="compute-kicker">正在生成今日鉴定</p>
          <p class="compute-title" id="compute-title">工位灯还亮着……</p>
        </div>
      </section>

      <section id="screen-result" class="screen" hidden>
        <canvas id="card" width="1080" height="1440" aria-label="今日生存鉴定卡片"></canvas>
        <div class="btn-stack">
          <div class="btn-row">
            <button type="button" id="btn-save" class="btn primary">保存图片</button>
            <button type="button" id="btn-share" class="btn soft">复制分享文案</button>
          </div>
          <button type="button" id="btn-again" class="btn ghost">再来一天</button>
        </div>
      </section>

      <footer class="footer">
        <span>作者 hukx</span>
        <span class="sep">·</span>
        <a href="https://afdian.com/a/hukxai" target="_blank" rel="noopener noreferrer">请作者喝奶茶</a>
      </footer>

      <div id="save-overlay" hidden>
        <div class="save-panel">
          <p class="save-hint">长按图片保存到相册</p>
          <img id="save-img" alt="今日生存鉴定卡片" />
          <button type="button" id="btn-close-save" class="btn ghost">关闭</button>
        </div>
      </div>

      <div id="copy-overlay" hidden>
        <div class="copy-panel">
          <p class="copy-hint">复制没成功，请手动复制下面的文案</p>
          <textarea id="copy-text" readonly rows="7"></textarea>
          <button type="button" id="btn-close-copy" class="btn primary">关闭</button>
        </div>
      </div>

      <div id="toast" hidden></div>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
